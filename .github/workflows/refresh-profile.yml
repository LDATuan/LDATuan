name: Refresh profile

on:
  schedule:
    - cron: "17 18 * * *"   # 02:17 in Singapore
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch the contribution calendar
        run: python scripts/fetch_contributions.py "${{ github.repository_owner }}" data/contributions.json

      - name: Redraw images and README
        run: python scripts/render.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh profile images [skip ci]"
            git push
          fi
